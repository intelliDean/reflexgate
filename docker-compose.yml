services:
  gateway:
    build: .
    container_name: typesafe-guardrail-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - gateway_data:/app/data

volumes:
  gateway_data:
    driver: local
